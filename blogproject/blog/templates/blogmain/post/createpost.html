{% extends 'blogmain/base.html' %}
{% block content %}
{% if request.user.is_authenticated %} 
<div class="container mt-5 mb-5">
    <div class="row d-flex align-items-center justify-content-center">
    <div class="col-md-6">
    <div class="card">
         <div class="d-flex justify-content-between p-2 px-3">
             <div class="d-flex flex-row align-items-center">
                 <div class="d-flex flex-column ml-2" > <a class="text-decoration-none text-reset"><span class="font-weight-bold">{{Author}}</span></a> <small class="text-primary">Collegues</small><form method="post" enctype="multipart/form-data">
                   {% csrf_token %}{{formcr.title}}
                   <br>
                   {{formcr.desc}}</div>
             </div>
             <div class="d-flex flex-row mt-1 ellipsis"> <small class="mr-2">{{data}}</small>
                 <div class="d-flex justify-content-center position-relative">
                 </div> </div> 
         </div>
         <div class="p-2">
            <input type="file" name="image" multiple>
             <hr>
             <button class="btn btn-success" type="post">Добавить статью</button>
         </form>
         <a href="{% url 'mainpage' %}"><button class="btn btn-danger">Отмена</button></a>
             </div>
         </div>
     </div>
    </div>
    </div>
    </div>
{% else %}
<div class="container d-flex align-items-center flex-column my-5">
    <h1>Извините, нужно быть зарегестрированым или аутентифицированым, для данного действия.</h1>
      </div>
{% endif %}
{% endblock %}
