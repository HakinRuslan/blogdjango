<script>
  function toggleComments(id) {
      var moreComments = document.getElementById('more-comments-' + id);
      if (moreComments.style.display === 'none') {

};


document.getElementById('file').addEventListener('change', function() {
    var fileList = this.files;
    var fileContainer = document.getElementById('file-list');

    // Очищаем контейнер перед добавлением новых файлов
    fileContainer.innerHTML = '';

    // Обрабатываем каждый загруженный файл
    Array.from(fileList).forEach(function(file) {
        var fileDiv = document.createElement('div');
        fileDiv.className = 'file-item';

        var fileLabel = document.createElement('span');  // Заменил на <span>
        fileLabel.innerText = truncateFileName(file.name, 20);;

        var removeIcon = document.createElement('span');  // Заменил на <span>
        removeIcon.className = 'remove-icon';
        removeIcon.innerHTML = '&times;';  // Добавляем символ крестика
        removeIcon.style.cursor = 'pointer';
        removeIcon.style.marginLeft = '10px';
        removeIcon.title = 'Удалить файл';

        // Добавляем событие для удаления файла
        removeIcon.addEventListener('click', function() {
            fileDiv.remove();
        });

        fileDiv.appendChild(fileLabel);
        fileDiv.appendChild(removeIcon);

        fileContainer.appendChild(fileDiv);
    });
});

// Функция для обрезки длинных имен файлов
function truncateFileName(fileName, maxLength) {
    if (fileName.length <= maxLength) return fileName;

    const halfLength = Math.floor(maxLength / 2);
    return fileName.slice(0, halfLength) + '...' + fileName.slice(-halfLength);
}

  
</script>
