{% extends 'blogmain/base.html' %}
{% block title %}Регрстрация{% endblock %}
{% block content %}
<div class="divcenter">
<div class="register-photo">
    <div class="form-container">
        <div class="image-holder"></div>
        <form method="post">
            {% csrf_token %}
            <h2 class="text-center"><strong>Create</strong> an account.</h2>
            <div class="form-group"> <input class="form-control" type="text" name="username" placeholder="Username" required=""> </div>
            <div class="form-group"> <input type="email" class="form-control" placeholder="Email Address" required="required"> </div>
            <div class="form-group"> <input class="form-control" type="password" name="password1" placeholder="Password" required=""> </div>
            <div class="form-group"> <input class="form-control" type="password" name="password2" placeholder="Confirm Password" required=""> </div>
            <div class="form-group">
                <div class="form-check"><label class="form-check-label"><input class="form-check-input" type="checkbox">I agree to the license terms.</label></div>
            </div>
            <div class="form-group"><button class="btn btn-primary btn-block">Sign Up</button></div><a class="already" href="{% url 'login' %}">You already have an account? Login here.</a>
        </form>
    </div>
</div>
</div>
{% endblock %}
