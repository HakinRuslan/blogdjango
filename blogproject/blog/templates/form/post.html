{% if request.user.is_authenticated %}
<div class="container mt-5 mb-5">
    <div class="row d-flex align-items-center justify-content-center">
    <div class={{class}}>
    <div class="card">
         <div class="d-flex justify-content-between p-2 px-3">
             <div class="d-flex flex-row align-items-center">
                {% if icon %}<img src="{{icon.url}}" alt="profileicon" class="rounded-circle" width="50">{% else %}<img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="profileicon" class="rounded-circle" width="50">{% endif %}
                 <div class="d-flex flex-column ml-2" > <a class="text-decoration-none text-reset"><span class="font-weight-bold">{{Author}}</span></a> <small class="text-primary">Collegues</small><form method="post" action="{% url 'createpost' %}" enctype="multipart/form-data">
                   {% csrf_token %}{{formcr.title}}
                   <br>
                   {{formcr.desc}}</div>
             </div>
             <div class="d-flex flex-row mt-1 ellipsis"> <small class="mr-2">{{datas}}</small>
                 <div class="d-flex justify-content-center position-relative">
                 </div> </div> 
         </div>
         <div class="p-2">
            <div class="custom-file-upload">
                <label for="file" id="file-label">
                    <i class="fa-solid fa-file"></i> Прикрепить фото
                </label>
                <input type="file" id="file" class="hidden" name="PREVIEW_PICTURE" maxlength="25" autocomplete="off" value="" name="image" multiple>
            </div>
            <div id="file-list"></div>
             <hr>
             <button class="btn btn-success" type="post">Добавить статью</button>
         </form>
         <a href="{% url 'mainpage' %}"><button class="btn btn-danger">Отмена</button></a>
             </div>
         </div>
     </div>
    </div>
    </div>
    </div>
    {% else %}
    {% endif %}
