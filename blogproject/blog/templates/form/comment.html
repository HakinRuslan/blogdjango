{% if request.user.is_authenticated %} 
<div class="comment-input">
    <form action="{% url 'createcomment' %}" method="post">{% csrf_token %}
    <input type="hidden" value="{{blogid}}" name="blog">
    <input type="hidden" value="{{request.path}}" name="red">{{desc}} 
    <button type="submit" class="btn btn-warning">Отправить</button>
    </form>
  </div>
{% else %}
<h6 class="text-secondary">Зарегистрируйтесь или войдите, чтобы оставлять коментарии</h6>
{% endif %}
